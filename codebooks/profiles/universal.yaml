name: universal
description: Sprachunabhängiges Profil — kategorisiert nach Verzeichnisstruktur statt Dateiendung
excludes:
  - build_artifacts
  - package_managers
  - dependencies
  - generated
  - docs
  - binaries
  - ide
  - ci_cache
  - game_engine
categories:
  # Struktur-basiert (sprachunabhängig)
  - entrypoint
  - deployment
  - scripts
  - static_assets
  # Verzeichnis-basiert (funktionieren für jede Sprache)
  - api
  - auth
  - middleware
  - data_access
  - domain
  - infrastructure
  - frontend
  - config
  - utils
  - testing
  - integration
  - caching
  - logging
  - validation
  - serialization
  - error_handling
  - security
  - scheduling
  - temp_dummy
  # Promoted 2026-05-11 from frequent [neu]X labels — diese sind
  # organisch als nützliche kategorien entstanden, gehören als anker
  # (kein [neu]-prefix mehr).
  - observability
  - monitoring
  - analytics
  - reporting
  - search
  - parsing
  - filtering
  - storage
  - cli
  - provider
  # Domänen-inhalt (für non-code chunks: papers, konversationen)
  - healthcare
  - research
  - machine_learning
  - analysis
  - evaluation
  - processing
