name: IGIO backfill (cloud memory.db)

# Hourly + on-demand admin-triggered backfill of chunks where igio_axis = ''.
# Runs on the self-hosted u-server runner so MCP_SERVICE_TOKEN comes straight
# from the production .env — zero secrets in repo settings, no SSH key juggling.
#
# What changed vs. the previous SSH-based version:
#   - was: github-hosted runner → ssh → docker exec mayring-mcp python -m src.cli
#   - now: self-hosted u-server runner → curl POST /stats/igio-backfill
# The endpoint runs the same `_cmd_classify_igio` code path in a FastAPI
# background thread, so behaviour is identical and the API is the canonical
# trigger for both cron and one-off admin runs.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max chunks to classify in this run"
        required: false
        default: "300"
      min_confidence:
        description: "Drop verdicts below this confidence"
        required: false
        default: "0.5"
      workspace_id:
        description: "Optional workspace filter (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: [self-hosted, u-server]
    timeout-minutes: 25
    steps:
      - name: POST /stats/igio-backfill (fire and forget)
        env:
          LIMIT: ${{ github.event.inputs.limit || '300' }}
          CONF: ${{ github.event.inputs.min_confidence || '0.5' }}
          WS: ${{ github.event.inputs.workspace_id || '' }}
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::error::MCP_SERVICE_TOKEN not in $ENV_FILE"
            exit 1
          fi
          QS="limit=${LIMIT}&min_confidence=${CONF}"
          if [ -n "${WS}" ]; then QS="${QS}&workspace_id=${WS}"; fi
          response=$(curl -sS -m 60 -X POST \
            "https://mcp.linn.games/stats/igio-backfill?${QS}" \
            -H "Authorization: Bearer $MCP_SERVICE_TOKEN")
          echo "queued: $response"
          job_id=$(echo "$response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("job_id",""))')
          if [ -z "$job_id" ]; then
            echo "::error::no job_id returned — endpoint may not exist or auth failed"
            exit 1
          fi
          # Fire-and-forget: the job runs async inside the API container. We
          # do NOT poll because the LLM loop hogs a worker thread for ~5-15
          # minutes per batch and the container can restart (deploy) mid-run.
          # The smoke-check `igio_axis_on_chunks` reports the resulting
          # coverage ratio, which is the real proof the work happened.
          echo "::notice::job ${job_id} dispatched; coverage rises over time"

      - name: Report current coverage ratio
        if: always()
        run: |
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          # Long timeout — the API can be slow when a backfill is running.
          curl -sS -m 60 -H "Authorization: Bearer $MCP_SERVICE_TOKEN" \
            https://mcp.linn.games/stats/igio-coverage | python3 -m json.tool || true
