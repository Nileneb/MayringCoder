name: IGIO coverage watch (#141 auto-close + auto-backfill)

# Acceptance-bound automation for Issue #141:
#
#   ratio < 0.50 AND issue #141 OPEN  → fire another backfill batch
#   ratio ≥ 0.50 AND issue #141 OPEN  → comment with live ratio + close
#   ratio ≥ 0.50 AND issue #141 CLOSED → no-op (idempotent)
#
# Runs hourly so the loop converges without manual nudging. Together
# with the existing igio-backfill cron @ :15, the workflow ensures
# #141's "Live-Beweis im Issue-Comment beim Closing" criterion is
# satisfied automatically — the closing comment will quote the actual
# coverage measurement at the moment the threshold was crossed.

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: [self-hosted, u-server]
    timeout-minutes: 5
    steps:
      - name: Read coverage + maybe close #141
        run: |
          set -uo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::error::MCP_SERVICE_TOKEN not in $ENV_FILE"
            exit 1
          fi
          coverage=$(curl -sS -m 30 -H "Authorization: Bearer $MCP_SERVICE_TOKEN" https://mcp.linn.games/stats/igio-coverage)
          echo "coverage: $coverage"
          ratio=$(echo "$coverage" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ratio",0))' 2>/dev/null || echo "0")
          total=$(echo "$coverage" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_active",0))' 2>/dev/null || echo "0")
          with_axis=$(echo "$coverage" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("with_axis",0))' 2>/dev/null || echo "0")
          echo "::notice::IGIO coverage ratio=${ratio} (${with_axis}/${total})"
          state=$(gh issue view 141 --repo Nileneb/MayringCoder --json state --jq '.state' 2>/dev/null || echo "OPEN")
          reached=$(python3 -c "import sys; print('yes' if float('${ratio}') >= 0.5 else 'no')")
          if [ "$reached" = "yes" ] && [ "$state" = "OPEN" ]; then
            echo "::notice::ratio ≥ 0.5 — closing #141"
            cmt="✅ Coverage-Threshold erreicht: ratio=${ratio} (${with_axis}/${total} Chunks). IGIO-Backfill cron + bulk-runs haben die Acceptance erfüllt. Auto-closed via igio-coverage-watch workflow."
            gh issue close 141 --repo Nileneb/MayringCoder --comment "$cmt" || true
          elif [ "$state" = "OPEN" ]; then
            echo "::notice::ratio ${ratio} < 0.5 — firing another backfill batch"
            gh workflow run igio-backfill.yml --repo Nileneb/MayringCoder -f limit=1500 -f min_confidence=0.5 || true
          else
            echo "::notice::#141 already closed — nothing to do"
          fi
