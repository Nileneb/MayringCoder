name: tests

# Gate für die ~1600 pytest-Tests (liefen bisher NUR lokal). Klar benannter
# Check "MayringCoder: pytest" → bricht etwas, ist sofort sichtbar welche
# Komponente, ohne die Pipeline zu durchsuchen.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: "MayringCoder: pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # vendor/mayring-pi-agent (public) → kein token nötig

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./vendor/mayring-core
          # pi-agent (Submodul) editable, --no-deps: seine mayring-core-git-dep ist
          # durch ./vendor/mayring-core oben befriedigt, restliche Runtime-Deps via requirements.txt.
          # Ohne diesen Install scheitern ~10 Tests mit `import mayring_pi_agent` (#266).
          pip install -e ./vendor/mayring-pi-agent --no-deps
          # Test-only: Parallelität (xdist) + Per-Test-Timeout. Bewusst NICHT in
          # requirements.txt → kein Prod-Image-Bloat, kein Deploy.
          pip install pytest-xdist pytest-timeout

      - name: pytest
        # -n auto: parallel über alle Runner-Cores (single-threaded waren es ~12 min).
        # --timeout: killt hängende Tests (z.B. Netzwerk-Retries ohne Ollama) statt
        # die ganze Pipeline zu blocken. --durations: macht die langsamsten Tests
        # sichtbar (Basis fürs Ausmisten veralteter, teuer getesteter Funktionen).
        run: pytest -q -p no:cacheprovider -n auto --timeout=120 --timeout-method=thread --durations=15
