name: Build & Push

# Deploy-Gate (#299): triggert NICHT mehr direkt auf push, sondern erst wenn der
# `tests`-Workflow auf master GRÜN durchläuft (workflow_run). Verhindert, dass ein
# Push mit roten Tests gebaut + nach Prod deployt wird (Incident 2026-05-26: commit
# 32c246a, rote Codebook-Tests, wurde deployt → Prod-Smoke rot). Spiegelt das
# bewährte app.linn.games/.github/workflows/deploy.yml-Pattern.
#
# Nebeneffekt: workflow_run kennt keinen paths-Filter → baut/deployt bei JEDEM
# grünen master-Push. Das ist gewollt: der alte paths-Filter hatte eine
# Silent-no-deploy-Lücke (z.B. vendor/mayring-pi-agent-Submodul-Bumps waren nicht
# gelistet → kein Rebuild trotz geänderter Image-Inhalte).
on:
  workflow_run:
    workflows: ["tests"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build image + trigger deploy
    runs-on: ubuntu-latest
    # Nur bei grünem tests-Lauf (oder manuellem Dispatch). Roter tests-Lauf →
    # Job übersprungen → kein Build, kein Deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Den GETESTETEN Commit bauen, nicht master-HEAD: workflow_run läuft sonst
          # gegen den default-branch-HEAD statt gegen den Commit, der die Tests bestand.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Resolve tested SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            nileneb/mayring:latest
            nileneb/mayring:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=mayring
          cache-to: type=gha,mode=max,scope=mayring
          provenance: false
          sbom: false

      - name: Trigger deploy in app.linn.games
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'Nileneb',
              repo: 'app.linn.games',
              event_type: 'mayring-deploy',
              client_payload: { tag: '${{ steps.sha.outputs.sha }}' }
            });
            console.log('mayring-deploy dispatched to app.linn.games (tag=${{ steps.sha.outputs.sha }})');
