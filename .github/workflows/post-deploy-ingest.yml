name: Post-deploy ingest

# After Build & Push completes successfully, fire a /populate against the
# freshly-deployed API so the new code is ingested into the memory store
# right away. Without this step, every push silently ages the memory by
# one commit — fixed code + stale memory = exactly the "fix in one repo
# masks bug in another" problem the user complained about.
#
# Runs on the same self-hosted u-server runner as the smoke suite, so
# MCP_SERVICE_TOKEN comes from ~/app.linn.games/.env. Zero secrets in
# repo settings.

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Least-privilege scope (CodeQL alert #127): the workflow only reads
# .env from the runner and POSTs to the API. No git writes, no issue
# creation, no package operations needed.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: [self-hosted, u-server]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Wait for the deploy to land
        if: github.event_name == 'workflow_run'
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 4 -o /dev/null https://mcp.linn.games/health; then
              echo "API healthy after ${i} attempts"; break
            fi
            sleep 5
          done
          # Uvicorn returns 200 on /health before all routes finish wiring
          # (startup migrations, includes etc.). Give it room.
          sleep 30

      - name: Re-embed codebook categories (BEFORE ingest so deductive links land)
        run: |
          set -uo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::warning::MCP_SERVICE_TOKEN not in $ENV_FILE — skipping category re-embed"
            exit 0
          fi
          # WHY(2026-05-28): codebook_categories vectors vanish from the Chroma
          # collection on a chroma-service restart (they persist in SQLite, not
          # the vector store). MUST run BEFORE /populate: the ingest's Phase-3.2
          # deductive link needs the category embeddings present, else reingested
          # chunks link to an EMPTY collection → 0 links → reranker-v3 cat_match
          # coverage decays every deploy (root-caused 2026-05-28). Idempotent.
          resp=$(curl -sS -m 180 -X POST https://mcp.linn.games/stats/admin/reembed-categories \
            -H "Authorization: Bearer $MCP_SERVICE_TOKEN" || echo '{"error":"curl failed"}')
          echo "::notice::reembed-categories: $resp"

      - name: Trigger /populate for MayringCoder repo
        run: |
          set -uo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::error::MCP_SERVICE_TOKEN not in $ENV_FILE"
            exit 1
          fi
          # Retry up to 3 times — the container can return nginx HTML
          # (502) during the first few seconds while Uvicorn finishes
          # startup. Only the JSON response counts. Single-line python
          # to keep YAML scanner happy.
          job_id=""
          for attempt in 1 2 3; do
            # X-Workspace-Id: bene — Service-Token defaultet seit
            # 2026-05-09 auf workspace='system' (Multi-Tenant-sicher).
            # Ohne den Header würde der Ingest in den 'system'-Bucket
            # landen statt in den User-Workspace. Pre-launch hardcoded
            # auf 'bene'; sobald multi-tenant kommt: pro Repo-Owner
            # mappen.
            response=$(curl -sS -m 30 -X POST https://mcp.linn.games/populate \
              -H "Authorization: Bearer $MCP_SERVICE_TOKEN" \
              -H "X-Workspace-Id: bene" \
              -H "Content-Type: application/json" \
              --data '{"repo":"https://github.com/Nileneb/MayringCoder"}')
            echo "[attempt $attempt] Response: $response"
            case "$response" in
              \{*)
                job_id=$(echo "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("job_id","") if sys.stdin else "")' 2>/dev/null || echo "")
                if [ -n "$job_id" ]; then break; fi
                ;;
            esac
            sleep 10
          done
          if [ -z "$job_id" ]; then
            echo "::error::no job_id after 3 attempts — last response: $response"
            exit 1
          fi
          echo "::notice::ingest job_id=$job_id queued; check /jobs/$job_id for progress"

      - name: Backfill chunk→category links (deductive, idempotent)
        run: |
          set -uo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::warning::MCP_SERVICE_TOKEN missing — skipping chunk-category backfill"
            exit 0
          fi
          # WHY(2026-05-28): the per-ingest deductive link only touches NEWLY
          # ingested chunks; the existing corpus (ingested pre-Phase-3.2 or while
          # the category Chroma was cold) stayed unlinked → reranker-v3 cat_match
          # had near-zero coverage on the retrieved set (verified: 8/10 search
          # candidates uncategorised → reranker_cat_match_fires red). This links
          # the whole corpus (LLM-free cosine, idempotent). Cursor-paginated;
          # loop until has_more=false. Warn-but-don't-fail.
          after=0
          for i in $(seq 1 80); do
            resp=$(curl -sS -m 150 -X POST \
              "https://mcp.linn.games/stats/admin/chunk-categories-backfill?after=${after}&limit=500" \
              -H "Authorization: Bearer $MCP_SERVICE_TOKEN" || echo '{}')
            echo "[backfill $i] $resp"
            after=$(echo "$resp" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("next_after",0))' 2>/dev/null || echo 0)
            more=$(echo "$resp" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("has_more",False))' 2>/dev/null || echo False)
            [ "$more" = "True" ] || break
          done
