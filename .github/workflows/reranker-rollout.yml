name: Reranker auto-rollout (memory v2.0)

# Once per day:
#   1. Train a fresh model if there's enough new data (separate workflow:
#      train-reranker.yml fires at 07:30).
#   2. This workflow runs at 08:00 — by which time the new weights are
#      cached. It calls /stats/admin/reranker-rollout-decision with
#      apply=true. The endpoint compares v1 vs v2 over the last 7 days
#      of A/B traffic; if one version's NDCG@5 beats the other by ≥2%
#      AND both have ≥30 queries of evidence, it flips the default.
#      Else it leaves the default at 'auto' (50/50) so the A/B keeps
#      running until evidence accumulates.
#
# The default starts at 'auto' (set in src/memory/reranker_v2.py) so
# every workspace runs an A/B from day one. The cron then converges
# to whichever version actually performs.
#
# Threshold: 2% (on precision@K, not NDCG — NDCG saturates near the ceiling) — chosen so noise doesn't trigger flips. With 30+
# queries per side and 2% precision delta, the chance of a Type-I
# (false-flip) error is below 5%.

on:
  # WHY(2026-05-10): cron disabled — siehe train-reranker.yml.
  # Auto-rollout darf nicht laufen solange feedback-historie neu
  # aufgebaut wird, sonst kippt default vorzeitig zurück auf v2.
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "NDCG uplift % needed to flip default"
        required: false
        default: "2"
      apply:
        description: "Actually flip the default (false = dry run)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  rollout:
    runs-on: [self-hosted, u-server]
    timeout-minutes: 5
    steps:
      - name: Run rollout decision
        env:
          THRESHOLD: ${{ github.event.inputs.threshold_pct || '2' }}
          APPLY: ${{ github.event.inputs.apply || 'true' }}
        run: |
          set -uo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::error::MCP_SERVICE_TOKEN not in $ENV_FILE"
            exit 1
          fi
          response=$(curl -sS -m 60 -X POST \
            "https://mcp.linn.games/stats/admin/reranker-rollout-decision?days=7&k=5&threshold_pct=${THRESHOLD}&apply=${APPLY}" \
            -H "Authorization: Bearer $MCP_SERVICE_TOKEN")
          echo "Decision response:"
          echo "$response" | python3 -m json.tool || echo "$response"
          # If applied, that's the headline; if kept, that's a notice.
          decision=$(echo "$response" | python3 -c \
            'import json,sys; d=json.load(sys.stdin); print(d.get("decision",""))' 2>/dev/null || echo "")
          target=$(echo "$response" | python3 -c \
            'import json,sys; d=json.load(sys.stdin); print(d.get("target",""))' 2>/dev/null || echo "")
          if [ "$decision" = "switch" ]; then
            echo "::notice::reranker default → $target"
          else
            echo "::notice::reranker default kept (auto-rollout sees no clear winner yet)"
          fi
