name: Post-deploy smoke (production)

# When this fires:
#   - 90 seconds after every push to master (gives auto-deploy time to land)
#   - manual `Run workflow` button on the Actions tab
#   - daily cron sweep at 06:00 UTC so we catch silent regressions overnight
#
# What it does:
#   - Runs tools/smoke_test_production.py against https://mcp.linn.games
#   - On failure: opens a labelled "smoke-failure" issue in this repo
#     → GitHub auto-emails repo subscribers, that IS the alert channel
#
# Why no Telegram/PagerDuty/Uptime-Kuma: GitHub Issues already have all
# three (notification, deduplication via title, history). Use what's there.

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      issues: write   # for `gh issue create` on failure
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for auto-deploy to complete
        if: github.event_name == 'push'
        run: |
          # Auto-deploy needs ~90s after push to land in production. We
          # poll the new commit hash via /health response or just sleep.
          # Sleep is the lazy-but-reliable choice.
          sleep 90

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke test (logs in via Sanctum → exercises user-auth)
        id: smoke
        env:
          # Long-lived Sanctum personal-access token from app.linn.games.
          # Set once: Settings → Secrets and variables → Actions →
          # MAYRING_SANCTUM_TOKEN. Smoke script trades it for a fresh JWT
          # at /api/mayring/refresh-token, so the run also tests:
          #   • Sanctum auth path
          #   • currentWorkspace() resolution
          #   • hasMayringAccess() subscription gate
          #   • JwtIssuer RS256 signing
          MAYRING_SANCTUM_TOKEN: ${{ secrets.MAYRING_SANCTUM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$MAYRING_SANCTUM_TOKEN" ]; then
            echo "::error::MAYRING_SANCTUM_TOKEN secret is not set"
            echo "Generate one at app.linn.games (Profile → Mayring → 'Watcher Setup')"
            echo "then add it under repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          set +e
          python tools/smoke_test_production.py --alert-on-fail
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the workflow if smoke failed
        if: steps.smoke.outputs.exit_code != '0'
        run: |
          echo "::error::Smoke test failed — see issue created above"
          exit 1
