name: Post-deploy smoke (production)

# When this fires:
#   - AFTER "Build & Push" completes successfully — that's when new
#     code is actually live in production. Triggering on `push` was
#     wrong: image build + registry push + remote auto-deploy take
#     5-10 min, the previous 90s sleep ran smoke against the OLD
#     container every single push.
#   - daily cron at 06:00 UTC catches silent overnight regressions
#   - manual `Run workflow` button (Actions tab)
#
# What it does:
#   - Runs tools/smoke_test_production.py against https://mcp.linn.games
#   - On failure: opens a labelled "smoke-failure" issue → GitHub
#     auto-emails repo subscribers (that IS the alert channel)

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Skip when the upstream Build & Push didn't actually land — no
    # point running smoke against a failed build.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      issues: write   # for `gh issue create` on failure
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the new image to actually land in production
        if: github.event_name == 'workflow_run'
        run: |
          # Build & Push complete = image in registry. Remote server
          # still needs to docker-compose pull + restart (~30-60s).
          # Poll /health instead of guessing a sleep length.
          for i in $(seq 1 60); do
            if curl -sf -m 4 -o /dev/null https://mcp.linn.games/health; then
              echo "API healthy after ${i} attempts"
              break
            fi
            sleep 5
          done
          # Safety margin so container finishes startup tasks
          # (DB migrations, hook registration) before smoke fires.
          sleep 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke test
        id: smoke
        env:
          # Two ways to authenticate, in priority order — pick one
          # whichever is more convenient:
          #
          # MCP_SERVICE_TOKEN — copy the value of MCP_SERVICE_TOKEN
          # straight out of ~/app.linn.games/docker-compose.mayring.yml
          # (it's server-internal, never rotates, no Browser/UI step).
          # Smoke runs as workspace=system; tests every endpoint, just
          # not "is this token user-derived" specifically.
          #
          # MAYRING_SANCTUM_TOKEN — generated once via
          # https://app.linn.games/settings/mayring-abo. Long-lived
          # Sanctum personal-access token; smoke trades it for a JWT
          # via /api/mayring/refresh-token, exercising the full user-
          # auth flow (Sanctum → currentWorkspace → hasMayringAccess →
          # JwtIssuer).
          #
          # If neither is set the workflow fails loud with instructions.
          MCP_SERVICE_TOKEN: ${{ secrets.MCP_SERVICE_TOKEN }}
          MAYRING_SANCTUM_TOKEN: ${{ secrets.MAYRING_SANCTUM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$MCP_SERVICE_TOKEN" ] && [ -z "$MAYRING_SANCTUM_TOKEN" ]; then
            cat <<'EOF'
            ::error::No auth secret configured for smoke tests.
            ::error::Set ONE of these in repo Settings → Secrets:
            ::error::  MCP_SERVICE_TOKEN — value already in docker-compose.mayring.yml
            ::error::  MAYRING_SANCTUM_TOKEN — from app.linn.games/settings/mayring-abo
          EOF
            exit 1
          fi
          set +e
          python tools/smoke_test_production.py --alert-on-fail
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the workflow if smoke failed
        if: steps.smoke.outputs.exit_code != '0'
        run: |
          echo "::error::Smoke test failed — see issue created above"
          exit 1
