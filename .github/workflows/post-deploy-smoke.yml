name: Post-deploy smoke (production)

# When this fires:
#   - AFTER "Build & Push" completes successfully — that's when new
#     code is actually live in production. Triggering on `push` was
#     wrong: image build + registry push + remote auto-deploy take
#     5-10 min, the previous 90s sleep ran smoke against the OLD
#     container every single push.
#   - daily cron at 06:00 UTC catches silent overnight regressions
#   - manual `Run workflow` button (Actions tab)
#
# What it does:
#   - Runs tools/smoke_test_production.py against https://mcp.linn.games
#   - On failure: opens a labelled "smoke-failure" issue → GitHub
#     auto-emails repo subscribers (that IS the alert channel)

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Self-hosted runner on u-server — same machine as production, so it
    # reads MCP_SERVICE_TOKEN directly from ~/app.linn.games/.env.
    # Zero secrets to copy in repo settings.
    runs-on: [self-hosted, u-server]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # stop_hook_e2e imports the real plugin hook. The plugin was extracted
      # to its own repo (#268) and is NOT installed on the server runner, so
      # _resolve_stop_hook_path() returned None → false-positive red. Check the
      # plugin out and point MAYRING_PLUGIN_DIR at it so the e2e tests the
      # latest published hook on CI.
      - name: Check out the plugin (provides stop_hook.py for stop_hook_e2e)
        uses: actions/checkout@v4
        with:
          repository: Nileneb/mayring-claude-plugin
          path: _plugin

      # Skip a now-stale smoke: if a newer Build & Push is queued/in-progress,
      # a new image is about to land → asserting against the current (about to be
      # torn down) box flaky-fails AND wastes the run. The newer deploy's own
      # smoke will cover it. Only relevant for workflow_run; schedule/manual
      # always run (gate step skipped → skip output empty → != '1' is true).
      - name: Gate — skip if a newer deploy is queued/in-progress
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          inprog=$(gh run list --workflow=build-and-push.yml --status in_progress --json databaseId -q 'length' 2>/dev/null || echo 0)
          queued=$(gh run list --workflow=build-and-push.yml --status queued     --json databaseId -q 'length' 2>/dev/null || echo 0)
          echo "pending Build & Push: in_progress=$inprog queued=$queued"
          if [ "${inprog:-0}" -gt 0 ] || [ "${queued:-0}" -gt 0 ]; then
            echo "::notice::Newer Build & Push pending — skipping this now-stale smoke."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the new image to actually land in production
        if: steps.gate.outputs.skip != '1' && github.event_name == 'workflow_run'
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 4 -o /dev/null https://mcp.linn.games/health; then
              echo "API healthy after ${i} attempts"; break
            fi
            sleep 5
          done
          sleep 10

      # Don't assert while post-deploy-ingest is still hammering the box — that
      # window saturates the single API and flaky-fails timing-sensitive checks
      # (feedback_count_delta, stop_hook_e2e, watcher_hook_fires, …). Wait until
      # /health is consistently fast (box quiet): 3 consecutive <0.5s probes,
      # best-effort up to ~4 min, then proceed regardless.
      - name: Wait for the box to settle (post-deploy-ingest load)
        if: steps.gate.outputs.skip != '1'
        run: |
          ok=0
          for i in $(seq 1 48); do
            t=$(curl -sS -m 5 -o /dev/null -w '%{time_total}' https://mcp.linn.games/health 2>/dev/null || echo 9)
            if awk "BEGIN{exit !($t < 0.5)}"; then ok=$((ok+1)); else ok=0; fi
            echo "settle probe $i: health=${t}s  consecutive_fast=$ok"
            if [ "$ok" -ge 3 ]; then echo "box settled"; break; fi
            sleep 5
          done

      # Chroma's HNSW index loads into RAM lazily on the first vector query after
      # a container restart — the first queries return diag='chroma_query_empty'
      # for a few seconds. Poll with UNIQUE queries (bypass _QUERY_CACHE) until
      # vector_stage is 'ok'. MUST target the populated workspace via
      # X-Workspace-Id: the service token defaults to workspace 'system', which
      # holds no embeddings → a query there is chroma_query_empty FOREVER (not
      # cold-start) and the loop could never warm/verify. If embeddings are
      # genuinely missing (a real regression), this never reaches 'ok' → the loop
      # exhausts and the smoke fails correctly — it warms, it does not mask.
      - name: Warm Chroma before asserting (HNSW load after restart)
        if: steps.gate.outputs.skip != '1'
        run: |
          ENV_FILE="$HOME/app.linn.games/.env"
          TOK="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          WS="${SMOKE_RAG_WORKSPACE:-019e14d6-0489-7348-bca8-e29c11293cb7}"
          for i in $(seq 1 24); do
            diag=$(curl -sS -m 20 -X POST https://mcp.linn.games/memory/search \
              -H "Authorization: Bearer $TOK" -H "X-Workspace-Id: $WS" \
              -H 'Content-Type: application/json' \
              -d "{\"query\":\"chroma warmup probe $i $RANDOM\",\"top_k\":3,\"include_text\":false}" \
              | python3 -c "import sys,json; print((json.load(sys.stdin).get('diagnostics') or {}).get('vector_stage',''))" 2>/dev/null)
            echo "warmup $i: ${diag:-<none>}"
            case "$diag" in ok*) echo "chroma warm after ${i} probes"; break;; esac
            sleep 5
          done

      - name: Run smoke test (reads MCP_SERVICE_TOKEN from server's .env)
        id: smoke
        if: steps.gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAYRING_PLUGIN_DIR: ${{ github.workspace }}/_plugin
        run: |
          ENV_FILE="$HOME/app.linn.games/.env"
          if [ -f "$ENV_FILE" ]; then
            export MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          fi
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::warning::MCP_SERVICE_TOKEN not in $ENV_FILE — checks will fail loud"
          fi
          set +e
          python3 tools/smoke_test_production.py --alert-on-fail
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the workflow if smoke failed
        if: steps.gate.outputs.skip != '1' && steps.smoke.outputs.exit_code != '0'
        run: |
          echo "::error::Smoke test failed — see issue created above"
          exit 1
