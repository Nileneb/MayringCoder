name: Post-deploy smoke (production)

# When this fires:
#   - 90 seconds after every push to master (gives auto-deploy time to land)
#   - manual `Run workflow` button on the Actions tab
#   - daily cron sweep at 06:00 UTC so we catch silent regressions overnight
#
# What it does:
#   - Runs tools/smoke_test_production.py against https://mcp.linn.games
#   - On failure: opens a labelled "smoke-failure" issue in this repo
#     → GitHub auto-emails repo subscribers, that IS the alert channel
#
# Why no Telegram/PagerDuty/Uptime-Kuma: GitHub Issues already have all
# three (notification, deduplication via title, history). Use what's there.

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      issues: write   # for `gh issue create` on failure
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for auto-deploy to complete
        if: github.event_name == 'push'
        run: |
          # Auto-deploy needs ~90s after push to land in production. We
          # poll the new commit hash via /health response or just sleep.
          # Sleep is the lazy-but-reliable choice.
          sleep 90

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke test
        id: smoke
        env:
          # Two ways to authenticate, in priority order — pick one
          # whichever is more convenient:
          #
          # MCP_SERVICE_TOKEN — copy the value of MCP_SERVICE_TOKEN
          # straight out of ~/app.linn.games/docker-compose.mayring.yml
          # (it's server-internal, never rotates, no Browser/UI step).
          # Smoke runs as workspace=system; tests every endpoint, just
          # not "is this token user-derived" specifically.
          #
          # MAYRING_SANCTUM_TOKEN — generated once via
          # https://app.linn.games/settings/mayring-abo. Long-lived
          # Sanctum personal-access token; smoke trades it for a JWT
          # via /api/mayring/refresh-token, exercising the full user-
          # auth flow (Sanctum → currentWorkspace → hasMayringAccess →
          # JwtIssuer).
          #
          # If neither is set the workflow fails loud with instructions.
          MCP_SERVICE_TOKEN: ${{ secrets.MCP_SERVICE_TOKEN }}
          MAYRING_SANCTUM_TOKEN: ${{ secrets.MAYRING_SANCTUM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$MCP_SERVICE_TOKEN" ] && [ -z "$MAYRING_SANCTUM_TOKEN" ]; then
            cat <<'EOF'
            ::error::No auth secret configured for smoke tests.
            ::error::Set ONE of these in repo Settings → Secrets:
            ::error::  MCP_SERVICE_TOKEN — value already in docker-compose.mayring.yml
            ::error::  MAYRING_SANCTUM_TOKEN — from app.linn.games/settings/mayring-abo
          EOF
            exit 1
          fi
          set +e
          python tools/smoke_test_production.py --alert-on-fail
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the workflow if smoke failed
        if: steps.smoke.outputs.exit_code != '0'
        run: |
          echo "::error::Smoke test failed — see issue created above"
          exit 1
