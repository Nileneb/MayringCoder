name: Reranker compare (v1 vs v2)

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Single query to compare"
        required: false
        default: "memory feedback hook"

permissions:
  contents: read

jobs:
  compare:
    runs-on: [self-hosted, u-server]
    timeout-minutes: 5
    steps:
      - name: Run side-by-side ranking comparison
        env:
          QUERY: ${{ github.event.inputs.query || 'memory feedback hook' }}
        run: |
          set -uo pipefail
          ENV_FILE="$HOME/app.linn.games/.env"
          MCP_SERVICE_TOKEN="$(grep '^MCP_SERVICE_TOKEN=' "$ENV_FILE" | cut -d= -f2-)"
          if [ -z "$MCP_SERVICE_TOKEN" ]; then
            echo "::error::MCP_SERVICE_TOKEN not in $ENV_FILE"
            exit 1
          fi
          echo "===== model state ====="
          curl -sS -m 15 -H "Authorization: Bearer $MCP_SERVICE_TOKEN" "https://mcp.linn.games/stats/admin/training-data-counts?days=7" | python3 -m json.tool
          for version in v1 v2; do
            echo ""
            echo "===== $version: '$QUERY' ====="
            curl -sS -m 30 -X POST https://mcp.linn.games/memory/search -H "Authorization: Bearer $MCP_SERVICE_TOKEN" -H "Content-Type: application/json" --data "{\"query\":\"${QUERY}\",\"top_k\":5,\"include_text\":false,\"llm_prefilter\":false,\"reranker_version\":\"${version}\"}" > /tmp/result.json
            python3 -c "import json; d=json.load(open('/tmp/result.json')); diag=d.get('diagnostics',{}); print(f'diag.reranker_version={diag.get(\"reranker_version\")} vector_stage={diag.get(\"vector_stage\")}'); rs=d.get('results',[]); print(f'top {len(rs)} chunks:'); [print(f'  {i}. {r.get(\"chunk_id\",\"?\")[:20]} final={r.get(\"score_final\",0):.3f} v={r.get(\"score_vector\",0):.2f} s={r.get(\"score_symbolic\",0):.2f} r={r.get(\"score_recency\",0):.2f} src={(r.get(\"source_id\",\"\") or \"\")[:42]}') for i,r in enumerate(rs,1)]"
          done
